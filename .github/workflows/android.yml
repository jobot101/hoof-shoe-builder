name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HOOF_KEYSTORE_B64: ${{ secrets.HOOF_KEYSTORE_B64 }}
      HOOF_KS_PASS: ${{ secrets.HOOF_KS_PASS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build web bundle and sync Android
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          if [ -n "$HOOF_KEYSTORE_B64" ]; then
            echo "$HOOF_KEYSTORE_B64" | base64 -d > app/hoofshoe.keystore
            ./gradlew assembleRelease -PversionCode=${{ github.run_number }} --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../HoofShoe.apk
          else
            echo "::notice::No signing secret set, building a debug APK (each build needs an uninstall before updating)."
            ./gradlew assembleDebug -PversionCode=${{ github.run_number }} --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../HoofShoe.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: HoofShoe-apk
          path: HoofShoe.apk

      - name: Publish release for phone download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: Hoof Shoe Android 1.0.${{ github.run_number }}
          body: Open this page on the phone and tap HoofShoe.apk to install.
          files: HoofShoe.apk
          make_latest: true
